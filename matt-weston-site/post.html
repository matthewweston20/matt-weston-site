<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matt Weston</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0B0A;
      --surface: #141413;
      --text: #EDE9E4;
      --text-muted: #7A7670;
      --text-faint: #4A4845;
      --accent: #C4984A;
      --border: #232321;
      --max-w: 660px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .nav-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--text); }

    /* BACK LINK */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-faint);
      margin: 40px 0 0;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--text-muted); }

    /* POST HEADER */
    .post-header {
      padding: 32px 0 48px;
    }

    .post-meta {
      font-size: 12px;
      color: var(--text-faint);
      letter-spacing: 0.04em;
      margin-bottom: 18px;
    }

    .post-header h1 {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .post-header .summary {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* COVER IMAGE */
    .cover-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 48px;
      background: var(--surface);
    }

    /* POST BODY */
    .post-body {
      padding-bottom: 80px;
    }

    .post-content {
      font-size: 17px;
      line-height: 1.78;
      color: var(--text-muted);
    }

    .post-content h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 48px 0 16px;
    }

    .post-content h3 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 36px 0 12px;
    }

    .post-content p {
      margin-bottom: 24px;
    }

    .post-content p:last-child { margin-bottom: 0; }

    .post-content strong {
      color: var(--text);
      font-weight: 500;
    }

    .post-content em {
      font-style: italic;
    }

    .post-content a {
      color: var(--text);
      border-bottom: 1px solid var(--border);
      transition: border-color 0.15s;
    }

    .post-content a:hover { border-color: var(--text-muted); }

    .post-content ul, .post-content ol {
      padding-left: 24px;
      margin-bottom: 24px;
    }

    .post-content li {
      margin-bottom: 8px;
    }

    .post-content blockquote {
      border-left: 2px solid var(--accent);
      padding-left: 20px;
      margin: 32px 0;
      font-style: italic;
      color: var(--text-muted);
    }

    .post-content img {
      width: 100%;
      border-radius: 6px;
      margin: 24px 0;
      display: block;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 40px 0;
    }

    .post-content code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 3px;
      color: var(--text);
    }

    .post-content pre {
      background: var(--surface);
      padding: 20px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 24px;
    }

    .post-content pre code {
      background: none;
      padding: 0;
    }

    /* NOT FOUND */
    .not-found {
      padding: 80px 0;
      text-align: center;
    }

    .not-found h2 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .not-found p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
    }

    .footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-copy {
      font-size: 12px;
      color: var(--text-faint);
    }

    .footer-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .footer-links a {
      font-size: 12px;
      color: var(--text-faint);
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--text-muted); }

    @media (max-width: 600px) {
      .nav-links { gap: 16px; }
      .footer-inner { flex-direction: column; gap: 16px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/images/matt.jpg" alt="Matt Weston" class="nav-avatar">
        Matt Weston
      </a>
      <ul class="nav-links">
        <li><a href="/#about">About</a></li>
        <li><a href="blog.html">Writing</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main id="main-content">
    <div class="container">
      <a href="blog.html" class="back-link">← All posts</a>
    </div>
    <div id="post-content-area"></div>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© 2026 Matt Weston</span>
      <ul class="footer-links">
        <li><a href="https://www.linkedin.com/in/mattmweston/" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="blog.html">Writing</a></li>
        <li><a href="mailto:matthewweston20@gmail.com">Email</a></li>
      </ul>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const area = document.getElementById('post-content-area');

      if (!slug) {
        showNotFound(area);
        return;
      }

      try {
        const res = await fetch('/data/posts.json');
        if (!res.ok) throw new Error('No data');
        const data = await res.json();
        const post = (data.posts || []).find(p => p.slug === slug);

        if (!post) {
          showNotFound(area);
          return;
        }

        document.title = `${post.title} — Matt Weston`;
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', post.summary || '');

        const coverHtml = post.image
          ? `<div class="container"><img src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" class="cover-image"></div>`
          : '';

        area.innerHTML = `
          <section class="post-header">
            <div class="container">
              <div class="post-meta">${formatDate(post.date)}</div>
              <h1>${escapeHtml(post.title)}</h1>
              ${post.summary ? `<p class="summary">${escapeHtml(post.summary)}</p>` : ''}
            </div>
          </section>
          <hr class="divider">
          ${coverHtml}
          <section class="post-body">
            <div class="container">
              <div class="post-content" id="post-body-content"></div>
            </div>
          </section>
        `;

        const bodyContent = document.getElementById('post-body-content');
        if (bodyContent && post.content) {
          bodyContent.innerHTML = marked.parse(post.content);
        }

      } catch (e) {
        showNotFound(area);
      }
    }

    function showNotFound(area) {
      area.innerHTML = `
        <section class="not-found">
          <div class="container">
            <h2>Post not found</h2>
            <p>This post doesn't exist or may have been moved.</p>
            <a href="blog.html" class="btn">← Back to writing</a>
          </div>
        </section>
      `;
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    loadPost();
  </script>

</body>
</html>
