<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Matt Weston</title>
  <meta name="description" content="Weekly posts on digital media, creator strategy and building teams.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0B0A;
      --surface: #141413;
      --surface-hover: #1A1A18;
      --text: #EDE9E4;
      --text-muted: #7A7670;
      --text-faint: #4A4845;
      --accent: #C4984A;
      --border: #232321;
      --max-w: 660px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 32px;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .nav-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--border);
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      font-size: 13px;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    /* PAGE HEADER */
    .page-header {
      padding: 64px 0 48px;
    }

    .page-header h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .page-header p {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 460px;
    }

    /* POSTS */
    .posts-list { padding: 0 0 64px; }

    .post-card {
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .post-card:first-child { border-top: 1px solid var(--border); }

    .post-meta {
      font-size: 12px;
      color: var(--text-faint);
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }

    .post-card h2 {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .post-card h2 a {
      color: var(--text);
      transition: color 0.15s;
    }

    .post-card h2 a:hover { color: var(--accent); }

    .post-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 16px;
      display: block;
      background: var(--surface);
    }

    .read-more {
      font-size: 13px;
      color: var(--text-faint);
      transition: color 0.15s;
    }

    .read-more:hover { color: var(--text); }

    .posts-empty {
      font-size: 15px;
      color: var(--text-faint);
      padding: 48px 0;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 0;
    }

    .footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-copy {
      font-size: 12px;
      color: var(--text-faint);
    }

    .footer-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .footer-links a {
      font-size: 12px;
      color: var(--text-faint);
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--text-muted); }

    @media (max-width: 600px) {
      .nav-links { gap: 16px; }
      .footer-inner { flex-direction: column; gap: 16px; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="/images/matt.jpg" alt="Matt Weston" class="nav-avatar">
        Matt Weston
      </a>
      <ul class="nav-links">
        <li><a href="/#about">About</a></li>
        <li><a href="blog.html" class="active">Writing</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section class="page-header">
      <div class="container">
        <p class="section-label">Writing</p>
        <h1>Media, strategy<br>and the people behind it.</h1>
        <p>Thoughts on digital media, creator strategy and building teams. One post, every week.</p>
      </div>
    </section>

    <hr class="divider">

    <div class="posts-list">
      <div class="container">
        <div id="posts-container">
          <p class="posts-empty">Loading posts...</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© 2026 Matt Weston</span>
      <ul class="footer-links">
        <li><a href="https://www.linkedin.com/in/mattmweston/" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="blog.html">Writing</a></li>
        <li><a href="mailto:matthewweston20@gmail.com">Email</a></li>
      </ul>
    </div>
  </footer>

  <script>
    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const res = await fetch('/data/posts.json');
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        const posts = (data.posts || []).sort((a, b) => new Date(b.date) - new Date(a.date));

        if (posts.length === 0) {
          container.innerHTML = '<p class="posts-empty">Posts coming soon.</p>';
          return;
        }

        container.innerHTML = posts.map(post => `
          <article class="post-card">
            ${post.image ? `<img src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" class="post-image" loading="lazy">` : ''}
            <div class="post-meta">${formatDate(post.date)}</div>
            <h2><a href="post.html?slug=${encodeURIComponent(post.slug)}">${escapeHtml(post.title)}</a></h2>
            <p class="post-summary">${escapeHtml(post.summary)}</p>
            <a href="post.html?slug=${encodeURIComponent(post.slug)}" class="read-more">Read post →</a>
          </article>
        `).join('');
      } catch (e) {
        container.innerHTML = '<p class="posts-empty">Posts coming soon.</p>';
      }
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    loadPosts();
  </script>

</body>
</html>
